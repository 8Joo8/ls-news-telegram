name: LS News Telegram

on:
  push:
    paths:
      - .github/workflows/news-test.yml
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ls-news-telegram
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Send news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat_id:
              raise SystemExit("Telegram secrets are missing.")

          url = "https://ai-powered-ir-intelligence-agent.vercel.app/api/news?source=naver"
          request = Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urlopen(request, timeout=30) as response:
              result = json.load(response)

          if not isinstance(result, dict) or result.get("success") is not True:
              raise SystemExit("News API failed.")
          articles = result.get("data")
          if not isinstance(articles, list) or not articles:
              raise SystemExit("News list is empty.")
          articles = [
              a for a in articles
              if isinstance(a, dict) and a.get("title")
          ]
          if not articles:
              raise SystemExit("No usable articles.")

          def article_key(article):
              link = str(article.get("url") or "").strip()
              fallback = str(article.get("source") or "") + "|" + str(article["title"])
              return hashlib.sha256((link or fallback).encode()).hexdigest()

          def article_text(article):
              title = str(article["title"])[:500]
              source = str(article.get("source") or "출처 미상")[:100]
              link = str(article.get("url") or "")[:2000]
              return f"📰 {title}\n언론사: {source}\n{link}"

          def send(text):
              payload = json.dumps({"chat_id": chat_id, "text": text}).encode()
              request = Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      reply = json.load(response)
              except HTTPError as error:
                  raise SystemExit(f"Telegram HTTP error: {error.code}") from None
              except Exception:
                  raise SystemExit("Telegram connection failed.") from None
              if not isinstance(reply, dict) or reply.get("ok") is not True:
                  raise SystemExit("Telegram send failed.")

          state = Path("seen_news.json")
          def save(keys):
              state.write_text(json.dumps(keys[-5000:]), encoding="utf-8")

          if not state.exists():
              send("✅ 뉴스 알림 연결 완료!\n최신 기사 1건을 보여드려요.\n\n" + article_text(articles[0]))
              keys = list(dict.fromkeys(article_key(a) for a in articles))
              save(keys)
              print(f"Initialized: {len(keys)} articles")
          else:
              keys = json.loads(state.read_text(encoding="utf-8"))
              if not isinstance(keys, list) or not all(isinstance(k, str) for k in keys):
                  raise SystemExit("Invalid news history.")
              seen = set(keys)
              count = 0
              for article in reversed(articles):
                  key = article_key(article)
                  if key in seen:
                      continue
                  send(article_text(article))
                  seen.add(key)
                  keys.append(key)
                  save(keys)
                  count += 1
                  time.sleep(1.1)
              print(f"New articles sent: {count}")
          PY

      - name: Save news history
        if: always()
        run: |
          if [ -f seen_news.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_news.json
            if ! git diff --cached --quiet; then
              git commit -m "Update news history"
              git push origin HEAD:main
            fi
          fi
